<svg id="nota0" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg" height="75%" width="75%">
    <desc>
        nbcli abstract machine
    </desc>
    <style>
        #nota0 {

            rect {
                fill: none;
                stroke: #222;
                stroke-width: 0.125px;
                x: 12.5px;
            }

            font-size: 2.5px;

