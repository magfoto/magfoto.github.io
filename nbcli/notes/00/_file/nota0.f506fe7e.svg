        <rect class="op" x="25" width="2.5" height="2.5"></rect>
        <rect class="op tcol" width="2.5" height="2.5"></rect>

        <rect x="25" y="9.5" width="2.5" height="2.5"></rect>
        <rect class="tcol" y="9.5" width="2.5" height="2.5"></rect>

        <rect x="25" y="14.5" width="2.5" height="2.5"></rect>
        <rect class="tcol" y="14.5" width="2.5" height="2.5"></rect>

        <rect x="25" y="19.5" width="2.5" height="2.5"></rect>
        <rect class="tcol" y="19.5" width="2.5" height="2.5"></rect>

        <line x1="27.5" y1="5.75" x2="30" y2="5.75"></line>

        <text x="22.5" y="22">
            E<tspan>o</tspan> → (xy 2 0 1)
