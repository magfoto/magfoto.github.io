<svg id="avci" viewBox="0 0 70 85" xmlns="http://www.w3.org/2000/svg" height="50%" width="50%">
    <desc>
        nbcli abstract machine
    </desc>
    <style>
        svg {
            background: #fff;
        }

        /* x-ray: proto-machinic view */
        #avci #sampler,
        #avci #pmos,
        #avci #ptrans,
        #avci #pmes {
            visibility: visible;
        }

        /* L2: ergomimetic view */
        #avci #expressor,
        #avci #mos,
        #avci path,
        #avci #c>rect,
        #avci #c>text,
        #avci #mes {
            visibility: hidden;
        }

        /* Model C: TRANS view */
        #avci #sampler,
        #avci #pmos,
        #avci #pmes,
        #avci .branch {
            visibility: hidden;
        }

        #avci #mos rect,
        #avci #mes rect {
            stroke: #999;
            fill: #fff;
        }

        #avci #mos,
        #avci #mes {
            stroke-width: 0.5px;
        }

        #avci #c {
            z-index: -999;
        }

        #avci #a {
            z-index: 2;
        }

        #avci path {
            stroke: black;
            fill: none;
            stroke-width: 0.125;
            stroke-dasharray: 1, .5;
        }

        #avci rect,
        #avci circle,
        #avci line {
            stroke-width: 0.25;
            stroke: #111;
            fill: none;
        }

        #avci rect.op {
            fill: #000;
        }

        #avci text {
            font: 2.5px sans-serif;
            fill: #111;
        }

        #avci .time {
            fill: #aaa;
            font: italic 2.5px sans-serif;
        }

        #avci #c rect:nth-child(10)~rect,
        .branch {
            stroke: #aaa;
            stroke-width: 0.125;
        }

        #avci #d text {
            /* fill: #aaa; */
        }

        #avci .bound {
            stroke: #aaa;
            stroke-width: 0.1;
        }

        #avci circle {
            fill: #fff;
        }

        #avci text tspan {
            font: 1.6px sans-serif;
            fill: #aaa;
        }
    </style>
    <g id="a">
        <g id="c">
            <g id="ptrans">
                <!-- <text class="time" x="27.25" y="20.25">t</text> -->
                <text x="26.5" y="28.25"></text>
                <text x="26.5" y="38.25"></text>
                <text x="26.5" y="48.25"></text>
                <text x="27" y="58.25"></text>
                <rect class="op" x="25" y="24.75" width="5" height="5"></rect>
                <rect x="25" y="34.75" width="5" height="5"></rect>
                <rect x="25" y="44.75" width="5" height="5"></rect>
                <rect x="25" y="54.75" width="5" height="5"></rect>
                <rect class="bound" x="22.5" y="22.25" width="10" height="30"></rect>
                <line x1="30" y1="27.5" x2="40" y2="27.5"></line>
                <line x1="30" y1="27.5" x2="40" y2="37.5"></line>
                <line x1="30" y1="27.5" x2="40" y2="47.5"></line>
                <line x1="30" y1="57.5" x2="40" y2="57.5"></line>
                <text x="41" y="28.25">
                    <tspan></tspan>
                </text>
                <text x="41" y="38.25">
                    <tspan></tspan>
                </text>
                <text x="41.25" y="48.25">
                    <tspan></tspan>
                </text>
                <text x="41" y="58.25">
                    <tspan></tspan>
                </text>
                <rect x="40" y="24.75" width="5" height="5"></rect>
                <rect x="40" y="34.75" width="5" height="5"></rect>
                <rect x="40" y="44.75" width="5" height="5"></rect>
                <rect x="40" y="54.75" width="5" height="5"></rect>
            </g>

            <g id="ptrans2">
                <!-- <text class="time" x="27.25" y="20.25">t</text> -->
                <text x="26.5" y="28.25"></text>
                <text x="26.5" y="38.25"></text>
                <text x="26.5" y="48.25"></text>
                <text x="27" y="58.25"></text>
                <rect class="op" x="25" y="24.75" width="5" height="5"></rect>
                <rect x="25" y="34.75" width="5" height="5"></rect>
                <rect x="25" y="44.75" width="5" height="5"></rect>
                <rect x="25" y="54.75" width="5" height="5"></rect>
                <rect class="bound" x="22.5" y="22.25" width="10" height="30"></rect>
                <line x1="30" y1="27.5" x2="40" y2="27.5"></line>
                <line x1="30" y1="27.5" x2="40" y2="37.5"></line>
                <line x1="30" y1="27.5" x2="40" y2="47.5"></line>
                <!-- <line x1="30" y1="57.5" x2="40" y2="57.5"></line> -->
                <text x="41" y="28.25">
                    <tspan></tspan>
                </text>
                <text x="41" y="38.25">
                    <tspan></tspan>
                </text>
                <text x="41.25" y="48.25">
                    <tspan></tspan>
                </text>
                <text x="41" y="58.25">
                    <tspan></tspan>
                </text>
                <rect x="40" y="24.75" width="5" height="5"></rect>
                <rect x="40" y="34.75" width="5" height="5"></rect>
                <rect x="40" y="44.75" width="5" height="5"></rect>
                <rect x="40" y="54.75" width="5" height="5"></rect>
            </g>
        </g>
    </g>
</svg>